# 待资源预检、服务健康检查通过后，合并到现有 www.mayuanfei.com HTTPS server。
# 只新增mword location，保留copilot及其他项目的root、代理、证书配置。
# 静态文件期望位于/var/www/mword/index.html；可由独立软链指向/opt/mword/current/web。
# 本级add_header会覆盖父级add_header继承，合并时应保留现有HSTS等安全header。
location = /mword { return 308 /mword/$is_args$args; }

# 精确匹配优先于现有全站静态正则，SW更新不使用长缓存，作用域只覆盖mword。
location = /mword/sw.js {
    root /var/www;
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
    add_header Service-Worker-Allowed "/mword/" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# ^~防止现有的location ~* \\.(js|css|svg|...)把本项目资源送往copilot或其他root。
location ^~ /mword/ {
    root /var/www;
    try_files $uri $uri/ /mword/index.html;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
}
location ^~ /mword/assets/ {
    root /var/www;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
}

# 没有尾斜杠的API根路径也归本项目；308保留请求方法与查询参数。
location = /mword-api { return 308 /mword-api/$is_args$args; }
location ^~ /mword-api/ {
    # 不附加URI/尾斜杠：原样保留/mword-api，与Spring context-path一致。
    proxy_pass http://127.0.0.1:18081;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 10s;
    proxy_read_timeout 35s;
    client_max_body_size 2m;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}
