spring:
  datasource:
    url: jdbc:h2:mem:mword;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  flyway:
    enabled: true
mword:
  ai-worker-enabled: false
  secure-cookie: false
  encryption-secret: ${MW_KEY_ENCRYPTION_SECRET:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
  admin-username: ${MW_ADMIN_USERNAME:}
  admin-password: ${MW_ADMIN_PASSWORD:}
