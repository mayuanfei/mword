name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'mword-client/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号 (如 1.0.0，留空则自动从 1.0.0 起递增)'
        required: false
        default: ''
      api_url:
        description: '后端 API 地址 (VITE_API_URL)'
        required: false
        default: 'https://www.mayuanfei.com/mword-api'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release version
        run: |
          git fetch --tags --force
          INPUT_VER="${{ github.event.inputs.version }}"
          if [[ -n "$INPUT_VER" ]]; then
            VERSION="${INPUT_VER#v}"
          else
            BASE_VERSION=$(node -p "require('./mword-client/package.json').version")
            MAJOR_MINOR="${BASE_VERSION%.*}"
            EXISTING=$(git tag -l "v${MAJOR_MINOR}.*" | sed "s/^v${MAJOR_MINOR}\.//" | grep -E '^[0-9]+$' | sort -n | tail -n 1 || true)
            if [[ -z "$EXISTING" ]]; then
              VERSION="$BASE_VERSION"
            else
              NEXT_PATCH=$((EXISTING + 1))
              VERSION="${MAJOR_MINOR}.${NEXT_PATCH}"
            fi
          fi
          TAG="v${VERSION}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
          echo "Resolved release version: ${VERSION} (tag: ${TAG})"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mword-client/package-lock.json

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install frontend dependencies & sync Capacitor
        working-directory: mword-client
        env:
          VITE_API_URL: ${{ github.event.inputs.api_url || 'https://www.mayuanfei.com/mword-api' }}
        run: |
          npm ci
          npm run cap:sync

      - name: Build Android APK
        working-directory: mword-client/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug -PversionName="${VERSION}" -PversionCode="${GITHUB_RUN_NUMBER}" --no-daemon

      - name: Prepare APK artifact
        run: |
          cp mword-client/android/app/build/outputs/apk/debug/app-debug.apk "mword-${VERSION}.apk"

      - name: Upload APK to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mword-android-apk-${{ env.VERSION }}
          path: mword-${{ env.VERSION }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: mword ${{ env.TAG }}
          files: mword-${{ env.VERSION }}.apk
          generate_release_notes: true
